parts:
  - id: "1"
    title: Vectors and Matrices
    summary: Vectors, linear combinations, dot products, angles, and matrix-vector multiplication.
    sections:
      - code: "1.1"
        title: Vectors and Linear Combinations
        links:
          - kind: lecture
            ref: 1
      - code: "1.2"
        title: Lengths and Angles from Dot Products
        links:
          - kind: lecture
            ref: 1
      - code: "1.3"
        title: Matrices and Their Column Spaces
        links:
          - kind: lecture
            ref: 1
      - code: "1.4"
        title: Matrix Multiplication AB and CR
        links:
          - kind: lecture
            ref: 3
    checklist:
      - "Can you compute linear combinations cv + dw in 2D and 3D?"
      - "Can you use the dot product to compute lengths and angles between vectors?"
      - "Do you see matrix multiplication both as column combinations and row combinations?"

  - id: "2"
    title: Solving Linear Equations Ax = b
    summary: Gaussian elimination, elimination matrices, matrix inverses, and LU factorization.
    sections:
      - code: "2.1"
        title: Elimination and Back Substitution
        links:
          - kind: lecture
            ref: 2
      - code: "2.2"
        title: Elimination Matrices and Inverse Matrices
        links:
          - kind: lecture
            ref: 3
      - code: "2.3"
        title: Matrix Computations and A = LU
        links:
          - kind: lecture
            ref: 4
      - code: "2.4"
        title: Permutations and Transposes
        links:
          - kind: lecture
            ref: 5
      - code: "2.5"
        title: Derivatives and Finite Difference Matrices
        links:
          - kind: lecture
            ref: 5
    checklist:
      - "Can you carry out Gaussian elimination with row operations to solve Ax = b?"
      - "Can you factor a matrix into A = LU (and PA = LU with row exchanges)?"
      - "Can you compute matrix inverses by Gauss-Jordan elimination?"

  - id: "3"
    title: The Four Fundamental Subspaces
    summary: Vector spaces, column space, nullspace, independence, basis, dimension, and the Fundamental Theorem.
    sections:
      - code: "3.1"
        title: Vector Spaces and Subspaces
        links:
          - kind: lecture
            ref: 6
      - code: "3.2"
        title: Computing the Nullspace (and more)
        links:
          - kind: lecture
            ref: 7
      - code: "3.3"
        title: The Complete Solution to Ax = b
        links:
          - kind: lecture
            ref: 8
      - code: "3.4"
        title: Independence, Basis and Dimension
        links:
          - kind: lecture
            ref: 9
      - code: "3.5"
        title: Dimensions of the Four Subspaces
        links:
          - kind: lecture
            ref: 10
    checklist:
      - "Can you find the nullspace of a matrix by finding special solutions?"
      - "Can you find the complete solution x = x_p + x_n to Ax = b?"
      - "Do you understand the dimensions and orthogonality of the four fundamental subspaces?"

  - id: "4"
    title: Orthogonality
    summary: Orthogonal subspaces, projection matrices, least squares regression, and the Gram-Schmidt process.
    sections:
      - code: "4.1"
        title: Orthogonality of the Four Subspaces
        links:
          - kind: lecture
            ref: 14
      - code: "4.2"
        title: Projections
        links:
          - kind: lecture
            ref: 15
      - code: "4.3"
        title: Least Squares Approximations
        links:
          - kind: lecture
            ref: 16
      - code: "4.4"
        title: Orthonormal Bases and Gram-Schmidt
        links:
          - kind: lecture
            ref: 17
    checklist:
      - "Can you compute the projection matrix P onto a subspace?"
      - "Can you solve normal equations A^T A x_hat = A^T b for least squares fitting?"
      - "Can you orthonormalize vectors using Gram-Schmidt to produce A = QR?"

  - id: "5"
    title: Determinants
    summary: Pivot formulas, cofactor expansions, Cramer's rule, and geometric volumes.
    sections:
      - code: "5.1"
        title: The Properties of Determinants
        links:
          - kind: lecture
            ref: 18
      - code: "5.2"
        title: Permutations and Cofactors
        links:
          - kind: lecture
            ref: 19
      - code: "5.3"
        title: Cramer's Rule, Inverses, and Volumes
        links:
          - kind: lecture
            ref: 20
    checklist:
      - "Can you compute determinants using pivots, the big permutation formula, or cofactors?"
      - "Can you apply Cramer's rule to solve small linear systems?"
      - "Do you understand how determinant magnitude gives box volume?"

  - id: "6"
    title: Eigenvalues and Eigenvectors
    summary: Diagonalization, system of differential equations, symmetric positive definite matrices, and complex matrices.
    sections:
      - code: "6.1"
        title: Introduction to Eigenvalues
        links:
          - kind: lecture
            ref: 21
      - code: "6.2"
        title: Diagonalizing a Matrix
        links:
          - kind: lecture
            ref: 22
      - code: "6.3"
        title: Symmetric Positive Definite Matrices
        links:
          - kind: lecture
            ref: 25
      - code: "6.4"
        title: Complex Numbers and Vectors and Matrices
        links:
          - kind: lecture
            ref: 26
      - code: "6.5"
        title: Solving Linear Differential Equations
        links:
          - kind: lecture
            ref: 23
    checklist:
      - "Can you find eigenvalues from det(A - lambda*I) = 0 and corresponding eigenvectors?"
      - "Can you diagonalize A = X Lambda X^(-1) to compute matrix powers A^k?"
      - "Can you test whether a symmetric matrix is positive definite using pivots, eigenvalues, and energy x^T A x > 0?"

  - id: "7"
    title: The Singular Value Decomposition (SVD)
    summary: Singular values and singular vectors, low-rank matrix approximations, image compression, and PCA.
    sections:
      - code: "7.1"
        title: Singular Values and Singular Vectors
        links:
          - kind: lecture
            ref: 29
      - code: "7.2"
        title: Image Processing by Linear Algebra
        links:
          - kind: lecture
            ref: 31
      - code: "7.3"
        title: Principal Component Analysis (PCA by the SVD)
        links:
          - kind: lecture
            ref: 29
    checklist:
      - "Can you factor any matrix A into U Sigma V^T?"
      - "Do you understand how the SVD provides optimal low-rank approximations A_k = sum sigma_i u_i v_i^T?"
      - "Can you apply SVD to find principal components in data matrices?"

  - id: "8"
    title: Linear Transformations
    summary: Linear mappings, the matrix of a transformation, and change of basis.
    sections:
      - code: "8.1"
        title: The Idea of a Linear Transformation
        links:
          - kind: lecture
            ref: 30
      - code: "8.2"
        title: The Matrix of a Linear Transformation
        links:
          - kind: lecture
            ref: 30
      - code: "8.3"
        title: The Search for a Good Basis
        links:
          - kind: lecture
            ref: 31
    checklist:
      - "Can you test whether a transformation T: V -> W is linear?"
      - "Can you construct the matrix representing T with respect to given input and output bases?"
      - "Can you perform change-of-basis transformations?"

  - id: "9"
    title: Linear Algebra in Optimization
    summary: Multivariable minimization, gradient descent, backpropagation, and linear programming duality.
    sections:
      - code: "9.1"
        title: Minimizing a Multivariable Function
        links:
          - kind: lecture
            ref: 27
      - code: "9.2"
        title: Backpropagation and Stochastic Gradient Descent
        links:
          - kind: lecture
            ref: 27
      - code: "9.3"
        title: Constraints, Lagrange Multipliers, Minimum Norms
        links:
          - kind: lecture
            ref: 33
      - code: "9.4"
        title: Linear Programming, Game Theory, and Duality
        links:
          - kind: lecture
            ref: 12
    checklist:
      - "Can you find stationary points and test the Hessian matrix for minimum conditions?"
      - "Do you understand gradient descent updates and the chain rule / backpropagation?"
      - "Can you set up Lagrange multiplier equations for constrained optimization?"

  - id: "10"
    title: Learning from Data
    summary: Piecewise linear learning functions, deep neural network architecture, and covariance matrices.
    sections:
      - code: "10.1"
        title: Piecewise Linear Learning Functions
        links:
          - kind: lecture
            ref: 29
      - code: "10.2"
        title: Creating and Experimenting
        links:
          - kind: lecture
            ref: 34
      - code: "10.3"
        title: Mean, Variance, and Covariance
        links:
          - kind: lecture
            ref: 29
    checklist:
      - "Can you write the matrix form of multi-layer neural networks F(x) = sigma(W_2 sigma(W_1 x + b_1) + b_2)?"
      - "Can you construct the sample mean, variance, and covariance matrix S = (1/(N-1)) X X^T?"

