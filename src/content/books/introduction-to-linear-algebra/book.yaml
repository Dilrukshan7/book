slug: introduction-to-linear-algebra
title: Introduction to Linear Algebra
author: Gilbert Strang
year: 2023
publisher: Wellesley-Cambridge Press
isbn: "978-1-7331466-7-8"
edition: "Sixth Edition"
level: introductory
subjects:
  - Linear Algebra
  - Applied Mathematics
  - Data Science
order: 2
status: available

tagline: The classic foundation of linear algebra, from geometry and elimination to SVD and data science.

description: >-
  Gilbert Strang's world-renowned introductory textbook connects the geometry of
  vectors and elimination to the fundamental subspaces, eigenvalues, the SVD,
  and modern optimization. This roadmap covers all 10 chapters and maps each
  section to Professor Strang's famous MIT 18.06 video lectures and problem sets.

coverMotif: grid

officialPage: https://math.mit.edu/~gs/linearalgebra/
buyUrl: https://www.wellesleycambridge.com/

accessNotice: >-
  MIT and the author publish the Table of Contents, selected sample sections,
  typos/errata, and solution sets freely online on MIT Mathematics. Fully free
  as well is MIT 18.06 (Linear Algebra), the complete course taught by Professor
  Strang with 34 recorded video lectures, transcripts, and problem sets. Every
  link here connects directly to MIT OpenCourseWare and official MIT servers.

