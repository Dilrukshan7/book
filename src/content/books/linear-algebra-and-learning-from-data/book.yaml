# ------------------------------------------------------------------ #
# The roadmap.
# ------------------------------------------------------------------ #
parts:
  - id: I
    title: Highlights of Linear Algebra
    summary: 'Column spaces, factorizations, eigenvalues, SVD: the foundation.'
    sections:
      - code: I.1
        title: Multiplication Ax Using Columns of A
        guide: i-1
        links:
          - kind: section-pdf
            url: https://math.mit.edu/~gs/learningfromdata/dsla1-1.pdf
          - kind: lecture
            ref: 1
      - code: I.2
        title: Matrix-Matrix Multiplication AB
        guide: i-2
        links:
          - kind: section-pdf
            url: https://math.mit.edu/~gs/learningfromdata/dsla1-2.pdf
          - kind: lecture
            ref: 2
      - code: I.3
        title: The Four Fundamental Subspaces
      - code: I.4
        title: Elimination and A = LU
      - code: I.5
        title: Orthogonal Matrices and Subspaces
        links:
          - kind: lecture
            ref: 3
      - code: I.6
        title: Eigenvalues and Eigenvectors
        links:
          - kind: lecture
            ref: 4
      - code: I.7
        title: Symmetric Positive Definite Matrices
        links:
          - kind: lecture
            ref: 5
      - code: I.8
        title: Singular Values and Singular Vectors in the SVD
        guide: i-8
        links:
          - kind: lecture
            ref: 6
      - code: I.9
        title: Principal Components and the Best Low Rank Matrix
        guide: i-9
        links:
          - kind: lecture
            ref: 7
      - code: I.10
        title: Rayleigh Quotients and Generalized Eigenvalues
      - code: I.11
        title: Norms of Vectors and Functions and Matrices
        links:
          - kind: lecture
            ref: 8
          - kind: lecture
            ref: 11
    checklist:
      - Redo at least one worked example by hand, not just reading it
      - Write the 4 fundamental subspaces from memory, with their dimensions
      - "State the SVD in your own words: what U, Σ, and V each represent"
      - Do 2-3 problems from the problem set PDF before checking solutions

  - id: II
    title: Computations with Large Matrices
    summary: Numerical linear algebra, least squares, randomized methods.
    sections:
      - code: II.1
        title: Numerical Linear Algebra
        links:
          - kind: lecture
            ref: 12
      - code: II.2
        title: "Least Squares: Four Ways"
        links:
          - kind: lecture
            ref: 9
      - code: II.3
        title: Three Bases for the Column Space
        links:
          - kind: lecture
            ref: 10
      - code: II.4
        title: Randomized Linear Algebra
        links:
          - kind: lecture
            ref: 13
    checklist:
      - List the 4 ways to solve least squares and when each one is preferred
      - Explain why randomized methods scale to matrices too big to store
      - Code a least-squares solve in numpy and compare it to the normal equations
      - Note the stability problems that motivate each method

  - id: III
    title: Low Rank and Compressed Sensing
    summary: How matrices change, interlacing eigenvalues, decaying singular values.
    sections:
      - code: III.1
        title: Changes in A⁻¹ from Changes in A
        links:
          - kind: lecture
            ref: 14
          - kind: lecture
            ref: 15
      - code: III.2
        title: Interlacing Eigenvalues and Low Rank Signals
        links:
          - kind: lecture
            ref: 16
          - kind: lecture
            ref: 18
      - code: III.3
        title: Rapidly Decaying Singular Values
        links:
          - kind: lecture
            ref: 17
      - code: III.4
        title: Split Algorithms for ℓ² + ℓ¹
      - code: III.5
        title: Compressed Sensing and Matrix Completion
    checklist:
      - Say in one sentence why low-rank updates matter computationally
      - Connect rapidly decaying singular values to real data compression
      - Sketch why interlacing bounds eigenvalues after a rank-one update
      - Skim Part VII to see where all of this reappears in deep learning

  - id: IV
    title: Special Matrices
    summary: Circulants, Fourier, graphs, clustering, distance matrices.
    sections:
      - code: IV.1
        title: "Fourier Transforms: Discrete and Continuous"
      - code: IV.2
        title: Shift Matrices and Circulant Matrices
        links:
          - kind: lecture
            ref: 31
          - kind: lecture
            ref: 30
      - code: IV.3
        title: The Kronecker Product A ⊗ B
      - code: IV.4
        title: Sine and Cosine Transforms from Kronecker Sums
      - code: IV.5
        title: Toeplitz Matrices and Shift Invariant Filters
        links:
          - kind: lecture
            ref: 32
      - code: IV.6
        title: Graphs and Laplacians and Kirchhoff's Laws
        links:
          - kind: lecture
            ref: 35
      - code: IV.7
        title: Clustering by Spectral Methods and k-means
        links:
          - kind: lecture
            ref: 35
      - code: IV.8
        title: Completing Rank One Matrices
        links:
          - kind: lecture
            ref: 30
      - code: IV.9
        title: The Orthogonal Procrustes Problem
        links:
          - kind: lecture
            ref: 34
      - code: IV.10
        title: Distance Matrices
        links:
          - kind: lecture
            ref: 33
          - kind: lecture
            ref: 34
    checklist:
      - Draw a small graph and build its Laplacian matrix by hand
      - Explain how spectral clustering uses eigenvectors of the Laplacian
      - Verify on a tiny circulant that its eigenvectors are Fourier modes
      - Name one real application per matrix type (image, audio, network)

  - id: V
    title: Probability and Statistics
    summary: 'Mean, variance, covariance: the statistical toolkit behind learning.'
    sections:
      - code: V.1
        title: Mean, Variance, and Probability
        links:
          - kind: lecture
            ref: 19
      - code: V.2
        title: Probability Distributions
        links:
          - kind: lecture
            ref: 20
      - code: V.3
        title: Moments, Cumulants, and Inequalities of Statistics
        links:
          - kind: lecture
            ref: 20
      - code: V.4
        title: Covariance Matrices and Joint Probabilities
      - code: V.5
        title: Multivariate Gaussian and Weighted Least Squares
      - code: V.6
        title: Markov Chains
    checklist:
      - Write mean, variance, and covariance definitions side by side
      - Connect the covariance matrix back to PCA from section I.9
      - Work one Markov chain example all the way to steady state
      - Relate weighted least squares back to Part II's four methods

  - id: VI
    title: Optimization
    summary: Convexity, Lagrange multipliers, gradient descent, duality.
    sections:
      - code: VI.1
        title: "Minimum Problems: Convexity and Newton's Method"
        links:
          - kind: lecture
            ref: 21
      - code: VI.2
        title: Lagrange Multipliers = Derivatives of the Cost
        links:
          - kind: lecture
            ref: 24
      - code: VI.3
        title: Linear Programming, Game Theory, and Duality
        links:
          - kind: lecture
            ref: 24
      - code: VI.4
        title: Gradient Descent Toward the Minimum
        links:
          - kind: lecture
            ref: 22
          - kind: lecture
            ref: 23
      - code: VI.5
        title: Stochastic Gradient Descent and ADAM
        links:
          - kind: lecture
            ref: 25
    checklist:
      - Derive the gradient descent update from a Taylor expansion sketch
      - Explain momentum in one or two sentences, in your own words
      - Compare batch gradient descent against the stochastic version
      - Code a basic gradient descent loop on a toy quadratic function

  - id: VII
    title: Learning from Data
    summary: Neural network architecture, convolutions, backpropagation.
    sections:
      - code: VII.1
        title: The Construction of Deep Neural Networks
        guide: vii-1
        links:
          - kind: section-pdf
            url: https://math.mit.edu/~gs/learningfromdata/dsla7-1.pdf
          - kind: lecture
            ref: 26
          - kind: lecture
            ref: 33
      - code: VII.2
        title: Convolutional Neural Nets
        links:
          - kind: lecture
            ref: 32
          - kind: lecture
            ref: 36
      - code: VII.3
        title: Backpropagation and the Chain Rule
        links:
          - kind: lecture
            ref: 27
      - code: VII.4
        title: "Hyperparameters: The Fateful Decisions"
      - code: VII.5
        title: The World of Machine Learning
    checklist:
      - Sketch a small net and label every weight, bias, and activation
      - Trace one forward pass and one backward pass by hand on a tiny net
      - Explain why convolution is a structured, low-parameter linear map
      - Write down how Parts I, III, and VI each feed into this chapter
