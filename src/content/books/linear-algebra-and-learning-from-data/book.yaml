slug: linear-algebra-and-learning-from-data
title: Linear Algebra and Learning from Data
author: Gilbert Strang
year: 2019
publisher: Wellesley-Cambridge Press
isbn: "978-0-692-19638-0"
order: 1
status: available

tagline: The linear algebra that deep learning is actually built on.

description: >-
  Gilbert Strang's graduate text connects the linear algebra you half-remember
  to the mathematics running underneath modern machine learning: the SVD,
  low-rank approximation, optimization, and the structure of neural networks.
  This roadmap walks all 46 sections in order and points each one at the
  material MIT publishes for free.

coverMotif: svd

officialPage: https://math.mit.edu/~gs/learningfromdata/
buyUrl: https://www.wellesleycambridge.com/


accessNotice: >-
  MIT does not host the full book. What is published free is the Table of
  Contents, the Preface, the Deep Learning essay, three complete sample
  sections (I.1, I.2 and VII.1), the errata, and three sets of solutions.
  Fully free, however, is MIT 18.065, the course Strang taught directly from
  this book: 36 video lectures plus problem sets, mapped section by section
  below. So for most sections the video and problems are your free route; a
  full section PDF exists only for the three samples. Everything here links to
  MIT's own servers. If you can afford the book, buy it. That supports the
  author.

